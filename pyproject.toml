[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcing-agent"
version = "0.1.0"
description = "Autonomous job-sourcing agent over 13 sources with capability-bound submission, a zero-LLM decision gate, and a spend-capped three-stage model funnel."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
browser = ["playwright>=1.44"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
sourcing-agent = "sourcing_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
